name: Build Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Allow matrix-js-sdk build in pnpm workspace
        run: |
          node -e "
            const fs = require('fs');
            const path = 'pnpm-workspace.yaml';
            let content = fs.readFileSync(path, 'utf8');
            const lines = content.split('\n');
            const result = [];
            let found = false;
            let inserted = false;
            for (const line of lines) {
              result.push(line);
              if (line.match(/^allowBuilds:\s*$/) && !found) {
                found = true;
                if (!content.includes('matrix-js-sdk: true')) {
                  result.push('  matrix-js-sdk: true');
                  inserted = true;
                }
              }
            }
            if (!found) {
              result.push('');
              result.push('allowBuilds:');
              result.push('  matrix-js-sdk: true');
              inserted = true;
            }
            if (inserted) {
              fs.writeFileSync(path, result.join('\n'));
              console.log('Added matrix-js-sdk to allowBuilds');
            } else {
              console.log('matrix-js-sdk already in allowBuilds, skipping');
            }
          "

      - name: Install dependencies
        run: |
          pnpm config set --location=project --json allowBuilds '{"matrix-js-sdk": true}'
          pnpm install --config.strict-dep-builds=false
          # Отключаем строгую проверку типов в tsconfig.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
            p.compilerOptions = p.compilerOptions || {};
            p.compilerOptions.skipLibCheck = true;
            fs.writeFileSync('tsconfig.json', JSON.stringify(p, null, 2));
          "

      - name: Create config directory and place config.json
        run: |
          New-Item -ItemType Directory -Force -Path myconfig | Out-Null
          @'
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "features": {
              "feature_encryption": false
            }
          }
          '@ | Out-File -Encoding utf8 myconfig/config.json

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Enable perMachine MSI installation
        working-directory: apps/desktop
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build=p.build||{};p.build.msi={perMachine:true,oneClick:false};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Build MSI package
        working-directory: apps/desktop
        run: pnpm run build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-desktop-msi
          path: apps/desktop/dist/*.msi
