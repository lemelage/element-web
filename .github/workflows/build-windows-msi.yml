name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          Remove-Item -Path pnpm-lock.yaml -Force
          pnpm install --ignore-scripts

      - name: Create config directory and place config.json
        run: |
          New-Item -ItemType Directory -Force -Path myconfig | Out-Null
          @'
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "force_verification": false,
            "features": {
              "feature_encryption": false
            },
            "setting_defaults": {
              "e2ee_default": false,
              "feature_encryption": false,
              "show_labs_settings": false
            },
            "io.element.e2ee": {
              "force_disable": true
            },
            "brand": "Молвушка"
          }
          '@ | Out-File -Encoding utf8 myconfig/config.json

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Patch auto-launch.ts
        working-directory: apps/desktop
        shell: cmd
        run: |
          node -e "const fs=require('fs');const p='src/auto-launch.ts';if(!fs.existsSync(p)){console.log('auto-launch.ts not found');process.exit(0);}let c=fs.readFileSync(p,'utf8');c=c.replace(/this\.opts/g,'(this as any).opts');fs.writeFileSync(p,c);console.log('Patched auto-launch.ts');"

      - name: Patch electron-main.ts
        working-directory: apps/desktop
        shell: cmd
        run: |
          node -e "const fs=require('fs');const p='src/electron-main.ts';if(!fs.existsSync(p)){console.log('electron-main.ts not found');process.exit(1);}let c=fs.readFileSync(p,'utf8');const s1='app.setAppUserModelId(buildConfig.appId);';if(c.indexOf(s1)===-1){console.log('AUMID pattern not found');process.exit(1);}c=c.replace(s1,'app.setAppUserModelId(\"ru.avt.molvushka\");');const s2='global.mainWindow.setContentProtection(store.get(\"enableContentProtection\"));';if(c.indexOf(s2)!==-1){const r='try { const iconPath = await getIconPath(); global.mainWindow.setIcon(iconPath); } catch (e) { console.error(\"[Molvushka] Failed to set window icon:\", e); }\n    '+s2;c=c.replace(s2,r);console.log('Patched setIcon too');}else{console.log('setIcon pattern not found (non-fatal)');}fs.writeFileSync(p,c);console.log('Patched electron-main.ts AUMID + setIcon');"

      - name: Configure package.json for full rebranding
        working-directory: apps/desktop
        shell: cmd
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.productName='Молвушка';p.description='Корпоративный мессенджер Молвушка';p.author={name:'AVT',email:'support@avt.local'};p.build=p.build||{};p.build.appId='ru.avt.molvushka';p.build.win=p.build.win||{};p.build.win.executableName='Molvushka';p.build.win.icon='../../build/icon.ico';p.build.win.target=['nsis'];p.build.nsis={oneClick:false,perMachine:true,allowToChangeInstallationDirectory:true,createDesktopShortcut:true,createStartMenuShortcut:true,shortcutName:'Молвушка',uninstallDisplayName:'Молвушка',installerIcon:'../../build/icon.ico',uninstallerIcon:'../../build/icon.ico',installerHeaderIcon:'../../build/icon.ico'};p.build.extraResources=[{'from':'.','to':'.','filter':['webapp.asar']},{'from':'../../build/icon.ico','to':'build/icon.ico'}];fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('Package.json configured');"

      - name: Build installer package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      - name: Find build output
        working-directory: apps/desktop
        run: |
          Write-Host "Searching for installer files..."
          Get-ChildItem -Path . -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: molvushka-installer
          path: |
            apps/desktop/dist/**/*.exe
          if-no-files-found: warn
