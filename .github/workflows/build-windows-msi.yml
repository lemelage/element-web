name: Build Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          Remove-Item -Path pnpm-lock.yaml -Force
          pnpm install --ignore-scripts

      - name: Create config directory and place config.json
        run: |
          New-Item -ItemType Directory -Force -Path myconfig | Out-Null
          @'
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "features": {
              "feature_encryption": false
            },
            "brand": "Молвушка"
          }
          '@ | Out-File -Encoding utf8 myconfig/config.json

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Check where webapp.asar is located
        working-directory: apps/desktop
        run: |
          Write-Host "=== Searching for webapp.asar in apps/desktop ==="
          Get-ChildItem -Path . -Recurse -Filter webapp.asar -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== Searching for webapp.asar in repository root ==="
          Get-ChildItem -Path ../.. -Recurse -Filter webapp.asar -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Enable perMachine MSI, set product name and appId
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            
            // Имя папки в Program Files, ярлыка и exe-файла (на английском)
            p.productName = 'Molvushka';
            
            p.build = p.build || {};
            // Уникальный appId — чтобы Windows считала приложение новым
            p.build.appId = 'ru.avt.molvushka';
            // Цель сборки — MSI
            p.build.win = { target: ['msi'] };
            p.build.msi = { perMachine: true, oneClick: false };
            // Явно включаем webapp.asar
            p.build.extraResources = [
              { 'from': '.', 'to': '.', 'filter': ['webapp.asar'] }
            ];
            
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Patch auto-launch.ts
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/auto-launch.ts';
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace(/this\.opts/g, '(this as any).opts');
            fs.writeFileSync(path, content);
            console.log('Patched auto-launch.ts');
          "

      - name: Build MSI package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      - name: Find build output
        working-directory: apps/desktop
        run: |
          Write-Host "Searching for MSI files..."
          Get-ChildItem -Path . -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-desktop-msi
          path: |
            apps/desktop/dist/**/*.msi
          if-no-files-found: warn
