name: Build Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Allow matrix-js-sdk build in pnpm
        run: |
          Add-Content -Path pnpm-workspace.yaml -Value "`nallowBuilds:`n  matrix-js-sdk: true"
        shell: pwsh

      - name: Install dependencies
        run: pnpm install

      - name: Create config directory and place config.json
        run: |
          mkdir myconfig
          echo '{
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "features": {
              "feature_encryption": false
            }
          }' > myconfig/config.json
        shell: pwsh

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Configure perMachine MSI
        working-directory: apps/desktop
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.build=p.build||{};p.build.msi={perMachine:true,oneClick:false};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Build MSI package
        working-directory: apps/desktop
        run: pnpm run build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-desktop-msi
          path: apps/desktop/dist/*.msi
