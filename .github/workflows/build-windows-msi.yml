name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          Remove-Item -Path pnpm-lock.yaml -Force
          pnpm install --ignore-scripts

      - name: Create config directory and place config.json
        run: |
          New-Item -ItemType Directory -Force -Path myconfig | Out-Null
          @'
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "force_verification": false,
            "features": {
              "feature_encryption": false
            },
            "setting_defaults": {
              "e2ee_default": false,
              "feature_encryption": false,
              "show_labs_settings": false
            },
            "io.element.e2ee": {
              "force_disable": true
            },
            "brand": "Молвушка"
          }
          '@ | Out-File -Encoding utf8 myconfig/config.json

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Patch auto-launch.ts
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/auto-launch.ts';
            if (fs.existsSync(path)) {
              let content = fs.readFileSync(path, 'utf8');
              content = content.replace(/this\.opts/g, '(this as any).opts');
              fs.writeFileSync(path, content);
              console.log('Patched auto-launch.ts');
            } else {
              console.log('auto-launch.ts not found, skipping');
            }
          "

      - name: Patch tray.ts to set window icon
        working-directory: apps/desktop
        run: |
          @'
          const fs = require('fs');
          const trayPath = 'src/tray.ts';
          if (!fs.existsSync(trayPath)) {
            console.log('tray.ts not found, skipping');
            process.exit(0);
          }

          let content = fs.readFileSync(trayPath, 'utf8');
          const searchPattern = "trayIcon.setToolTip(getConfig().brand);";
          const replacement = `trayIcon.setToolTip(getConfig().brand);
    // PATCH: also set the main window icon for Windows taskbar
    if (global.mainWindow) {
        global.mainWindow.setIcon(defaultIcon);
    }`;

          if (content.includes(searchPattern)) {
            content = content.replace(searchPattern, replacement);
            fs.writeFileSync(trayPath, content);
            console.log('Patched tray.ts with window icon');
          } else {
            console.log('Pattern not found in tray.ts');
          }
          '@ | Out-File -Encoding utf8 patch_tray.cjs

          node patch_tray.cjs
          Remove-Item patch_tray.cjs

      - name: Configure package.json for full rebranding
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            
            p.productName = 'Молвушка';
            p.description = 'Корпоративный мессенджер Молвушка';
            p.author = {
              name: 'AVT',
              email: 'support@avt.local'
            };
            
            p.build = p.build || {};
            p.build.appId = 'ru.avt.molvushka';
            
            p.build.win = p.build.win || {};
            p.build.win.executableName = 'Molvushka';
            p.build.win.icon = '../../build/icon.ico';
            p.build.win.target = ['nsis'];
            
            p.build.nsis = {
              oneClick: false,
              perMachine: true,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true,
              shortcutName: 'Молвушка',
              uninstallDisplayName: 'Молвушка',
              installerIcon: '../../build/icon.ico',
              uninstallerIcon: '../../build/icon.ico',
              installerHeaderIcon: '../../build/icon.ico'
            };
            
            p.build.extraResources = [
              { 'from': '.', 'to': '.', 'filter': ['webapp.asar'] },
              { 'from': '../../build/icon.ico', 'to': 'build/icon.ico' }
            ];
            
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            console.log('Package.json configured');
          "

      - name: Build installer package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      - name: Find build output
        working-directory: apps/desktop
        run: |
          Write-Host "Searching for installer files..."
          Get-ChildItem -Path . -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: molvushka-installer
          path: |
            apps/desktop/dist/**/*.exe
          if-no-files-found: warn
