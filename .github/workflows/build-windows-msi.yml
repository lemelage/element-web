name: Build Windows MSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          Remove-Item -Path pnpm-lock.yaml -Force
          pnpm install --ignore-scripts

      - name: Create config directory and place config.json
        run: |
          New-Item -ItemType Directory -Force -Path myconfig | Out-Null
          @'
          {
            "default_server_config": {
              "m.homeserver": {
                "base_url": "https://chat.avt.local"
              }
            },
            "sso_redirect_options": {
              "immediate": true,
              "on_welcome_page": true
            },
            "disable_custom_urls": true,
            "force_verification": false,
            "features": {
              "feature_encryption": false
            },
            "setting_defaults": {
              "e2ee_default": false,
              "feature_encryption": false,
              "show_labs_settings": false
            },
            "io.element.e2ee": {
              "force_disable": true
            },
            "brand": "Молвушка"
          }
          '@ | Out-File -Encoding utf8 myconfig/config.json

      - name: Fetch Element Web with custom config
        working-directory: apps/desktop
        run: pnpm run fetch --noverify --cfgdir ../../myconfig

      - name: Patch auto-launch.ts
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/auto-launch.ts';
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace(/this\.opts/g, '(this as any).opts');
            fs.writeFileSync(path, content);
            console.log('Patched auto-launch.ts');
          "

      - name: Configure package.json (English productName, Russian shortcutName)
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            
            // === СИСТЕМНОЕ ИМЯ (английское) — для EXE и папки установки ===
            // Это имя будет использоваться в путях и не вызовет ошибок LGHT0311
            p.productName = 'Molvushka';
            
            p.build = p.build || {};
            p.build.win = p.build.win || {};
            p.build.win.executableName = 'Molvushka';
            p.build.win.icon = '../../build/icon.ico';
            p.build.win.target = ['msi'];
            
            // === MSI: английское productName + русский ярлык ===
            p.build.msi = {
              perMachine: true,
              oneClick: false,
              warningsAsErrors: false,
              shortcutName: 'Молвушка'  // <-- Русское имя ярлыка
            };
            
            p.build.appId = 'ru.avt.molvushka';
            p.build.extraResources = [
              { 'from': '.', 'to': '.', 'filter': ['webapp.asar'] }
            ];
            
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            console.log('Configured: productName=Molvushka, shortcutName=Молвушка');
          "

      - name: Build MSI package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build

      - name: Find build output
        working-directory: apps/desktop
        run: |
          Write-Host "Searching for MSI files..."
          Get-ChildItem -Path . -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-desktop-msi
          path: |
            apps/desktop/dist/**/*.msi
          if-no-files-found: warn
